<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Octubre, para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap" rel="stylesheet">
<style>
/* ===================== PALETA DE OCTUBRE ===================== */
@property --sky-a { syntax: '<color>'; inherits: true; initial-value: #2A1B3D; }
@property --sky-b { syntax: '<color>'; inherits: true; initial-value: #7A3B5E; }
@property --sky-c { syntax: '<color>'; inherits: true; initial-value: #F0A04B; }
@property --hill-far { syntax: '<color>'; inherits: true; initial-value: #5A2E4A; }
@property --hill-near { syntax: '<color>'; inherits: true; initial-value: #3A1E33; }
@property --canopy { syntax: '<color>'; inherits: true; initial-value: #C2412D; }

:root {
  --maple: #B8322A;
  --gold: #F6C77B;
  --parchment: #FBEBD6;
  --paper: #FBF1E1;
  --ink: #3A2027;
  --plum: #170D22;
  --px: 0; --py: 0;
  --serif: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --hand: 'Caveat', 'Segoe Print', cursive;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  overflow: hidden;
  background: var(--plum);
  color: var(--parchment);
  font-family: var(--serif);
  -webkit-font-smoothing: antialiased;
  transition: --sky-a 2.6s ease, --sky-b 2.6s ease, --sky-c 2.6s ease,
              --hill-far 2.6s ease, --hill-near 2.6s ease, --canopy 2.6s ease;
}

/* Colores del cielo y colinas por escena */
body[data-scene="gate"], body[data-scene="intro"], body[data-scene="dusk"], body[data-scene="finale"] {
  --sky-a: #2A1B3D; --sky-b: #7A3B5E; --sky-c: #F0A04B; --hill-far: #5A2E4A; --hill-near: #3A1E33; --canopy: #C2412D; }
body[data-scene="view"]    { --sky-a: #3B2142; --sky-b: #A1475A; --sky-c: #F6C177; --hill-far: #6B3350; --hill-near: #42203A; --canopy: #D9622B; }
body[data-scene="october"] { --sky-a: #4A2A1E; --sky-b: #A8472A; --sky-c: #F3C47A; --hill-far: #6E3424; --hill-near: #47211C; --canopy: #E07A2E; }
body[data-scene="fall"]    { --sky-a: #5B2A2E; --sky-b: #C2532B; --sky-c: #F2B35A; --hill-far: #7A3324; --hill-near: #4E1F1E; --canopy: #E8A23A; }
body[data-scene="stars"]   { --sky-a: #0E0C2A; --sky-b: #241E4A; --sky-c: #4E3460; --hill-far: #221A3A; --hill-near: #150F26; --canopy: #6E2A3A; }
body[data-scene="girl"]    { --sky-a: #2C1838; --sky-b: #8E3D5C; --sky-c: #E98A6B; --hill-far: #4F2742; --hill-near: #2F1830; --canopy: #B8322A; }
body[data-scene="world"]   { --sky-a: #0B1030; --sky-b: #1E2150; --sky-c: #3F2D5E; --hill-far: #1E1838; --hill-near: #120D22; --canopy: #5A2436; }

/* ===================== CIELO ===================== */
.sky { position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(to bottom, var(--sky-a) 0%, var(--sky-b) 58%, var(--sky-c) 100%); }
.sun, .moon { position: fixed; border-radius: 50%; pointer-events: none; z-index: 1;
  transition: transform 3s cubic-bezier(.5,0,.2,1), opacity 2.4s ease; }
.sun { width: 34vmin; height: 34vmin; left: 52%; bottom: 20vh;
  background: radial-gradient(circle, #FFE3A6 0 30%, rgba(255,196,120,.55) 34%, rgba(255,160,90,0) 70%);
  transform: translate(calc(var(--px) * -6px), 0); }
.moon { width: 12vmin; height: 12vmin; right: 13vw; top: 11vh; opacity: 0; transform: translateY(6vh); }
.moon svg { display: block; width: 100%; overflow: visible; filter: drop-shadow(0 0 14px rgba(255,240,210,.55)) drop-shadow(0 0 40px rgba(255,230,190,.25)); }
.clouds { position: fixed; inset: 0; z-index: 3; pointer-events: none; transition: opacity 2.4s ease; }
.cloud { position: absolute; animation: drift 46s ease-in-out infinite alternate; }
.cloud svg { display: block; width: 100%; }
.cloud.c1 { top: 13vh; left: -4vw; width: clamp(160px, 30vw, 380px); }
.cloud.c2 { top: 25vh; right: -3vw; width: clamp(120px, 22vw, 280px); animation-duration: 58s; animation-direction: alternate-reverse; opacity: .85; }
.cloud.c3 { top: 6vh; left: 48vw; width: clamp(90px, 15vw, 200px); animation-duration: 38s; opacity: .7; }
@keyframes drift { to { transform: translateX(7vw); } }
body[data-scene="stars"] .clouds, body[data-scene="world"] .clouds { opacity: 0; }
body[data-scene="girl"] .clouds { opacity: .55; }
body[data-scene="stars"] .sun, body[data-scene="world"] .sun { transform: translateY(40vh); opacity: 0; }
body[data-scene="girl"] .sun { transform: translateY(14vh); opacity: .6; }
body[data-scene="stars"] .moon, body[data-scene="world"] .moon, body[data-scene="girl"] .moon { opacity: 1; transform: none; }

canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#skyCanvas { z-index: 2; }
#fxCanvas { z-index: 7; }

.constellation { position: fixed; z-index: 3; left: 50%; top: 5vh; width: min(74vw, 520px);
  transform: translate(calc(-50% + var(--px) * 8px), calc(var(--py) * 6px)); pointer-events: none; overflow: visible; }
.constellation polyline { fill: none; stroke: rgba(255,236,200,.7); stroke-width: .35;
  stroke-dasharray: 1; stroke-dashoffset: 1; }
.constellation circle { fill: #FFF3DA; opacity: 0; transform-box: fill-box; transform-origin: center; }
body[data-scene="stars"] .constellation polyline { stroke-dashoffset: 0; transition: stroke-dashoffset 3.4s ease .8s; }
body[data-scene="stars"] .constellation circle { opacity: 1; animation: twinkle 2.4s ease-in-out infinite;
  transition: opacity .6s ease calc(var(--i) * 120ms + .4s); }
@keyframes twinkle { 50% { transform: scale(.55); } }

/* Deseo escrito por la estrella fugaz */
.wish { position: fixed; z-index: 5; left: 50%; top: calc(8vh + min(74vw, 520px) * .62);
  width: max-content; max-width: 88vw; transform: translateX(-50%); text-align: center; pointer-events: none;
  font: 700 clamp(1.8rem, 6.6vw, 3.2rem)/1.1 var(--hand); color: #FFF1D6; text-wrap: balance;
  text-shadow: 0 0 10px rgba(255,220,160,.8), 0 0 28px rgba(255,190,120,.45);
  -webkit-mask-image: linear-gradient(90deg, #000 45%, transparent 55%); mask-image: linear-gradient(90deg, #000 45%, transparent 55%);
  -webkit-mask-size: 220% 100%; mask-size: 220% 100%;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  -webkit-mask-position: 100% 0; mask-position: 100% 0;
  opacity: 0; transition: opacity 1.2s ease; }
body[data-scene="stars"] .wish { opacity: 1; }
.wish.done { animation: wishglow 3s ease-in-out infinite; }
@keyframes wishglow { 50% { text-shadow: 0 0 16px rgba(255,230,180,.95), 0 0 42px rgba(255,190,120,.6); } }

/* ===================== PAISAJE ===================== */
.land { position: fixed; left: 0; right: 0; bottom: 0; height: 34vh; z-index: 4;
  transition: transform 2.2s cubic-bezier(.6,0,.2,1); }
.land svg.hill { position: absolute; inset: 0; width: 100%; height: 100%; }
.hill-far path { fill: var(--hill-far); }
.hill-near path { fill: var(--hill-near); }
.hill-far { transform: translateX(calc(var(--px) * -8px)) scaleX(1.03); }
.hill-near { transform: translateX(calc(var(--px) * -16px)) scaleX(1.05); }
body[data-scene="view"] .land, body[data-scene="october"] .land { transform: translateY(14%); }
body[data-scene="girl"] .land { transform: translateY(32%); }
body[data-scene="world"] .land { transform: translateY(115%); }

.tree { position: absolute; right: 2%; bottom: 9vh; width: clamp(150px, 26vw, 300px);
  transform-origin: 50% 100%; animation: sway 7s ease-in-out infinite; }
body[data-scene="fall"] .tree { animation-duration: 2.6s; }
.tree .canopy { fill: var(--canopy); }
.tree svg { display: block; width: 100%; overflow: visible; }
.tree .trunk { fill: var(--hill-near); filter: brightness(.8); }
.tree .roots { stroke: var(--hill-near); filter: brightness(.8); }
.swing { transform-box: view-box; transform-origin: 144px 140px; animation: swing 4.6s ease-in-out infinite; }
@keyframes swing { 0%,100% { transform: rotate(4deg); } 50% { transform: rotate(-4deg); } }
.pumpkin { position: absolute; }
.pumpkin svg { display: block; width: 100%; }
.pumpkin.p1 { left: 54%; bottom: 10vh; width: clamp(30px, 5vw, 58px); }
.pumpkin.p2 { right: 25%; bottom: 9vh; width: clamp(24px, 3.8vw, 44px); }
.lantern { position: absolute; left: 6%; bottom: 10vh; width: clamp(20px, 3.2vw, 36px); }
.lantern svg { position: relative; display: block; width: 100%; }
.lantern-glow { position: absolute; left: 50%; top: 52%; width: 520%; aspect-ratio: 1; transform: translate(-50%, -50%);
  border-radius: 50%; background: radial-gradient(circle, rgba(255,196,110,.55), rgba(255,170,80,0) 65%);
  opacity: .45; transition: opacity 2s ease; animation: flicker 2.8s ease-in-out infinite; }
body[data-scene="stars"] .lantern-glow, body[data-scene="dusk"] .lantern-glow, body[data-scene="finale"] .lantern-glow { opacity: 1; }
@keyframes flicker { 0%,100% { transform: translate(-50%,-50%) scale(1); } 30% { transform: translate(-50%,-50%) scale(.93); } 60% { transform: translate(-50%,-50%) scale(1.05); } }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flame 1.3s ease-in-out infinite; }
@keyframes flame { 50% { transform: scaleY(.82) skewX(4deg); } }
@keyframes sway { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(1.6deg); } }

.girl-fig { position: absolute; left: 12%; bottom: 10vh; width: clamp(82px, 14vw, 140px); transform-origin: 50% 100%;
  transition: opacity 1.2s ease, filter 2s ease; }
.girl-fig svg { display: block; width: 100%; overflow: visible; }
.coat { fill: #C98A2E; } .hair { fill: #3A2230; } .beret, .scarf { fill: var(--maple); }
.head { transform-box: view-box; transform-origin: 70px 92px; transition: transform 2.2s cubic-bezier(.4,0,.2,1); }
.scarf-tail { transform-box: view-box; transform-origin: 90px 106px; animation: tail 3.2s ease-in-out infinite; }
body[data-scene="fall"] .scarf-tail { animation-duration: 1.1s; }
@keyframes tail { 50% { transform: rotate(-14deg) skewY(4deg); } }
body[data-scene="stars"] .head { transform: rotate(-14deg); }
.hair-sway { transform-box: view-box; transform-origin: 70px 70px; animation: hairsway 5s ease-in-out infinite; }
body[data-scene="fall"] .hair-sway { animation-duration: 1.6s; }
@keyframes hairsway { 50% { transform: skewX(-2.5deg); } }
body[data-scene="stars"] .girl-fig { filter: brightness(.55) saturate(.8); }
body[data-scene="view"] .girl-fig, body[data-scene="october"] .girl-fig, body[data-scene="girl"] .girl-fig { opacity: 0; }

/* Ella salta al montón de hojas */
.girl-fig.leap { animation: leap 4.4s cubic-bezier(.45,0,.35,1) forwards; }
@keyframes leap {
  0%   { transform: translate(0, 0) rotate(0) scale(1, 1); }
  7%   { transform: translate(0, 3%) rotate(0) scale(1.05, .92); }
  19%  { transform: translate(45%, -60%) rotate(9deg) scale(1, 1); }
  29%  { transform: translate(90%, 6%) rotate(2deg) scale(1.06, .9); }
  35%  { transform: translate(90%, 4%) rotate(0) scale(1, 1); }
  68%  { transform: translate(90%, 4%) rotate(-2deg) scale(1, 1); }
  72%  { transform: translate(88%, 6%) rotate(-2deg) scale(1.04, .93); }
  83%  { transform: translate(42%, -42%) rotate(-7deg) scale(1, 1); }
  94%  { transform: translate(0, 2%) rotate(0) scale(1.04, .95); }
  100% { transform: translate(0, 0) rotate(0) scale(1, 1); }
}
.pile { position: absolute; left: calc(12% + clamp(82px, 14vw, 140px) * .8); bottom: 9vh; width: clamp(96px, 19vw, 210px);
  transform-origin: 50% 100%; transition: filter 2s ease; }
.pile svg { display: block; width: 100%; overflow: visible; }
.pile.boom { animation: boom 2.6s cubic-bezier(.2,.8,.3,1); }
@keyframes boom { 0% { transform: none; } 7% { transform: scale(1.22, .5); } 30% { transform: scale(1.12, .74); } 100% { transform: none; } }
body[data-scene="stars"] .pile { filter: brightness(.55) saturate(.8); }

.him { position: absolute; left: 70%; bottom: 19.5vh; width: clamp(18px, 2.8vw, 30px); opacity: 0;
  transition: opacity 2s ease 1.2s; }
.him svg { display: block; width: 100%; overflow: visible; }
body[data-scene="stars"] .him { opacity: .9; }

/* ===================== ESCENAS ===================== */
.sc { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center;
  padding: calc(4vh + env(safe-area-inset-top, 0px)) 4vw calc(24vh + env(safe-area-inset-bottom, 0px));
  opacity: 0; visibility: hidden; pointer-events: none; transform: scale(1.05);
  transition: opacity 1.3s ease, transform 1.8s cubic-bezier(.22,.61,.36,1), visibility 0s linear 1.8s; }
.sc.on { opacity: 1; visibility: visible; transform: none;
  transition: opacity 1.4s ease .25s, transform 2s cubic-bezier(.22,.61,.36,1), visibility 0s; }
.sc.leaving { transform: scale(.94) translateY(-2vh); }

/* Intro: título tipo videoclip */
.title { text-align: center; }
.title h1 { margin: 0; font-style: italic; font-weight: 500; font-variation-settings: "opsz" 144;
  font-size: clamp(3.2rem, 15vw, 8.6rem); line-height: .95; letter-spacing: -.02em; }
.title .ch { display: inline-block; opacity: 0; transform: translateY(.5em) rotate(6deg); filter: blur(10px); }
.sc-intro.on .ch { animation: rise 1.5s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i) * 90ms + .6s); }
@keyframes rise { to { opacity: 1; transform: none; filter: none; } }
.title p { margin: .4em 0 0; font-family: var(--hand); font-weight: 500; font-size: clamp(1.5rem, 5vw, 2.4rem);
  color: var(--gold); clip-path: inset(0 100% 0 0); }
.sc-intro.on .title p { clip-path: inset(0 0 0 0); transition: clip-path 2.2s cubic-bezier(.6,0,.2,1) 2s; }

/* Visor de cámara */
.vf { position: fixed; inset: calc(5vmin + env(safe-area-inset-top, 0px)) 5vmin calc(5vmin + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.vf i { position: absolute; width: 7vmin; height: 7vmin; border: 2px solid rgba(251,235,214,.85); }
.vf i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
.vf i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
.vf i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
.vf i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }
.rec { position: absolute; top: 2.4vmin; left: 9vmin; display: flex; align-items: center; gap: .5em;
  font: 600 .95rem var(--serif); }
.rec::before { content: ""; width: .7em; height: .7em; border-radius: 50%; background: #E2453A; animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.stamp { position: absolute; right: 9vmin; bottom: 2.4vmin; font: 700 1.1rem "Courier New", monospace;
  color: #FF9A3C; text-shadow: 0 0 6px rgba(255,140,40,.8); }
.shot { position: relative; perspective: 900px; }

/* Ventana moderna: marco fino redondeado, cortinas de lino y luz cálida */
.frame-wrap { position: relative; opacity: 0; transform: translateY(8vh) scale(.92);
  transition: transform 1.6s cubic-bezier(.2,.9,.25,1), opacity 1s ease; }
.sc-view.on .frame-wrap { opacity: 1; transform: rotateY(calc(var(--px) * 8deg)) rotateX(calc(var(--py) * -6deg)); }
.halo { position: absolute; inset: -20% -34%; z-index: 0; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255,196,120,.4), rgba(255,160,90,.12) 55%, rgba(255,160,90,0));
  animation: breathe 6s ease-in-out infinite; }
.bokeh { position: absolute; inset: -14% -26%; z-index: 0; pointer-events: none; }
.bokeh i { position: absolute; border-radius: 50%; opacity: .35;
  background: radial-gradient(circle, rgba(255,218,160,.85), rgba(255,200,140,0) 70%);
  animation: bokeh 7s ease-in-out infinite; }
@keyframes bokeh { 50% { transform: translateY(-12px) scale(1.15); opacity: .9; } }
.win { position: relative; z-index: 1; width: min(60vw, 270px, 40vh); padding: 7px; border-radius: 28px;
  background: linear-gradient(145deg, #3E2C32, #1C1216);
  box-shadow: inset 0 0 0 1px rgba(246,199,123,.5), 0 34px 70px -20px rgba(20,6,20,.75), 0 0 70px -12px rgba(246,170,90,.45); }
.opening { position: relative; aspect-ratio: 4 / 5; overflow: hidden; border-radius: 22px; background: #2A1520; }
.lamp { position: absolute; inset: 0; z-index: 1; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(circle at 75% 15%, rgba(255,196,120,.38), rgba(255,196,120,0) 55%),
              linear-gradient(to top, rgba(140,50,20,.22), rgba(140,50,20,0) 40%); }
.curtain { position: absolute; z-index: 2; top: 0; bottom: 0; width: 52%; transition: transform 2.6s cubic-bezier(.6,0,.2,1); }
.curtain.l { left: 0; transform-origin: 0 0; }
.curtain.r { right: 0; transform-origin: 100% 0; }
.curtain i { position: absolute; inset: 0; display: block; transform-origin: 50% 0;
  background: repeating-linear-gradient(90deg, rgba(251,241,225,.82) 0, rgba(240,222,198,.58) 8px, rgba(251,241,225,.86) 16px);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  animation: billow 6s ease-in-out infinite; }
.curtain.r i { animation-delay: -3s; }
@keyframes billow { 50% { transform: skewX(1.2deg) scaleX(1.02); } }
.sc-view.on .curtain { transform: scaleX(.16); transition-delay: 1s; }
.sc-view.on .win.peek .curtain { transform: none; }
.sc-view.on .win.quick .curtain { transition-duration: .7s; transition-delay: 0s; }
.glass { position: absolute; inset: 0; z-index: 4; pointer-events: none; border-radius: inherit;
  box-shadow: inset 0 0 0 1px rgba(246,199,123,.3), inset 0 0 34px rgba(255,220,180,.14);
  background: linear-gradient(120deg, rgba(255,255,255,0) 28%, rgba(255,255,255,.14) 36%, rgba(255,255,255,0) 44%, rgba(255,255,255,0) 58%, rgba(255,255,255,.08) 62%, rgba(255,255,255,0) 68%);
  background-size: 160% 100%; background-position: calc(50% + var(--px) * 30px) 0; }
.ledge { position: relative; z-index: 2; height: 8px; margin: 0 -14px; border-radius: 8px;
  background: linear-gradient(#4A3438, #24181C);
  box-shadow: inset 0 1px 0 rgba(246,199,123,.45), 0 10px 16px -8px rgba(20,6,20,.6); }
.decor { position: absolute; right: 9%; bottom: 100%; width: clamp(32px, 9vw, 42px); margin-bottom: -2px; }
.decor svg { display: block; width: 100%; overflow: visible; }
.twig { transform-box: fill-box; transform-origin: 50% 100%; animation: twig 4s ease-in-out infinite alternate; }
@keyframes twig { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
.win-cap { margin: .6em 0 0; text-align: center; font: 700 clamp(1.5rem, 5vw, 2rem)/1 var(--hand); color: var(--gold);
  text-shadow: 0 2px 12px rgba(23,13,34,.6); opacity: 0; transform: translateY(6px);
  transition: opacity 1s ease 2.4s, transform 1s ease 2.4s; }
.sc-view.on .win-cap { opacity: 1; transform: none; }

img.photo { display: block; width: 100%; height: 100%; object-fit: cover; }
.opening img.photo, .arch img.photo { animation: kenburns 18s ease-in-out infinite alternate; }
@keyframes kenburns { from { transform: scale(1.04); } to { transform: scale(1.16) translate(-2%, -2.5%); } }
.sc-view.on .shot, .sc-girl.on .hero { animation: float 7s ease-in-out 2s infinite; }
@keyframes float { 50% { transform: translateY(-10px); } }
.sun { animation: glow 7s ease-in-out infinite; }
.moon { animation: glow 5s ease-in-out infinite; }
@keyframes glow { 50% { filter: brightness(1.15) saturate(1.1); } }

/* Calendario 3D con hojas que se arrancan */
.cal-wrap { perspective: 1100px; }
.cal-swing { transform-origin: 50% 0; }
.sc-october.on .cal-swing { animation: hang 6.5s ease-in-out 1.8s infinite; }
@keyframes hang { 0%,100% { transform: rotate(0); } 30% { transform: rotate(1.4deg); } 70% { transform: rotate(-1.1deg); } }
.cal { position: relative; width: min(84vw, 340px); background: var(--paper); color: var(--ink);
  border-radius: 6px; padding: 30px 20px 22px;
  box-shadow: 0 3px 0 -1px #EBDCC4, 0 6px 0 -2px #E0CDAF, 0 36px 70px -22px rgba(30,10,20,.7);
  transform-origin: 50% 0; transform: rotateX(-100deg); opacity: 0;
  transition: transform 1.8s cubic-bezier(.22,1.15,.36,1), opacity .5s ease; }
.sc-october.on .cal { opacity: 1; transform: rotateX(0) rotateY(calc(var(--px) * 8deg)); }
.cal::before, .cal::after { content: ""; position: absolute; z-index: 12; top: -9px; width: 12px; height: 24px; border-radius: 6px;
  background: linear-gradient(90deg, #4E3428, #D8BFA2 45%, #7A5646); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), 0 2px 3px rgba(30,10,10,.3); }
.cal::before { left: 28%; } .cal::after { right: 28%; }
.cal h2 { margin: 0; font-weight: 600; font-variation-settings: "opsz" 144; font-size: clamp(2.2rem, 9vw, 3rem); line-height: 1;
  letter-spacing: .14em; opacity: 0; filter: blur(6px);
  transition: letter-spacing 2.2s cubic-bezier(.22,.61,.36,1) .1s, opacity 1.2s ease .1s, filter 1.4s ease .1s; }
.cal.revealed h2 { letter-spacing: -.01em; opacity: 1; filter: none; }

// Enredadera de otoño que crece alrededor del marco de su foto
function vineSVG() {
  const pts = [];
  for (let y = 120; y >= 50; y -= 1) pts.push([2.5, y]);
  for (let a = Math.PI; a >= 0; a -= .02) pts.push([50 + Math.cos(a) * 47.5, 50 - Math.sin(a) * 47.5]);
  for (let y = 50; y <= 82; y += 1) pts.push([97.5, y]);
  const out = pts.map(([x, y], i) => {
    const [nx, ny] = pts[Math.min(i + 1, pts.length - 1)], [px, py] = pts[Math.max(i - 1, 0)];
    const tx = nx - px, ty = ny - py, l = Math.hypot(tx, ty) || 1, w = Math.sin(i * .16) * 1.8;
    return [x + (-ty / l) * w, y + (tx / l) * w, Math.atan2(ty, tx)];
  });
  const d = 'M' + out.map(([x, y]) => x.toFixed(1) + ' ' + y.toFixed(1)).join(' L');
  const L = uid('vl'), cols = ['#E07A2E', '#C2412D', '#E8A23A', '#B8322A', '#D9902F'];
  let leaves = '', n = 0;
  for (let i = 6; i < out.length; i += 13) {
    const [x, y, a] = out[i], side = n % 2 ? 1 : -1, ang = a * 57.3 + side * 55 - 90;
    leaves += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang.toFixed(0)}) scale(${(.075 + (n % 3) * .015).toFixed(3)})"><use class="vl" href="#${L}" fill="${cols[n % cols.length]}" style="--i:${n}"/></g>`;
    if (n % 3 === 1) leaves += `<circle class="berry" style="--i:${n}" cx="${(x + 2.5 * side).toFixed(1)}" cy="${(y + 1.5).toFixed(1)}" r="1.3" fill="#8E1E2A"/>`;
    n++;
  }
  return `<svg class="vine" viewBox="0 0 100 125" aria-hidden="true"><defs><path id="${L}" d="${LEAF_D}" transform="translate(-50 -96)"/></defs>
  <path class="stem" pathLength="1" d="${d}"/>${leaves}</svg>`;
}

function worldDecoSVG() {

    const a = deg * Math.PI / 180, x = 100 + 67 * Math.sin(a), y = 100 - 67 * Math.cos(a);

  };
  return tree(-22, 1, '#E07A2E') + tree(24, .9, '#C2412D') + tree(38, .65, '#E8A23A') + tree(-38, .7, '#B8322A');
}

function makeOrbit(box, html, { rx, ry, speed }) {
  box.innerHTML = html;
  const items = [...box.children];
  let a = 0;
  return dt => {
    a += dt * speed;
    const w = box.clientWidth, h = box.clientHeight;
    items.forEach((it, i) => {
      const ang = a + i * Math.PI * 2 / items.length, d = (Math.sin(ang) + 1) / 2;
      it.style.transform = `translate(-50%,-50%) translate(${Math.cos(ang) * w * rx}px,${Math.sin(ang) * h * ry}px) scale(${.55 + .55 * d})`;
      it.style.zIndex = d > .5 ? 3 : 1;
      it.style.opacity = .4 + .6 * d;
    });
  };
}

function drawLeaf(l, alpha = 1) {
  const c = Math.cos(l.fl), flip = Math.max(.1, Math.abs(c)) * (c < 0 ? -1 : 1);
  fxx.save(); fxx.globalAlpha = alpha; fxx.translate(l.x, l.y); fxx.rotate(l.rot); fxx.scale(l.s * flip, l.s);
  fxx.fillStyle = c < 0 ? SHADE[l.col] : l.col;
  if (l.oval) { fxx.beginPath(); fxx.ellipse(0, 0, .5, 1, 0, 0, 6.283); fxx.fill(); }
  else {
    fxx.fill(leafPath);
    if (l.s > 11) { fxx.strokeStyle = 'rgba(70,15,10,.38)'; fxx.lineWidth = .06; fxx.stroke(veinPath); }
  }

function drawSky(dt) {
  const p = PRESET[scene];
  starAlpha += (p.stars - starAlpha) * Math.min(1, dt * .9);
  sx.clearRect(0, 0, W, H);
  if (starAlpha > .02) for (const s of stars) {
    sx.fillStyle = `rgba(255,244,222,${starAlpha * (.5 + .5 * Math.sin(clock * s.sp + s.ph))})`;
    sx.beginPath(); sx.arc(s.x * W, s.y * H, s.r, 0, 6.283); sx.fill();
  }
  if (!reduce && Math.random() < p.shoot * dt) shooting.push({ x: rand(W * .2, W), y: rand(H * .03, H * .3), vx: -rand(380, 620), vy: rand(160, 260), life: 1 });
  for (let i = shooting.length - 1; i >= 0; i--) {
    const s = shooting[i]; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt * 1.1;
    if (s.life <= 0) { shooting.splice(i, 1); continue; }
    const tx = s.x - s.vx * .18, ty = s.y - s.vy * .18, g = sx.createLinearGradient(s.x, s.y, tx, ty);
    g.addColorStop(0, `rgba(255,240,210,${s.life})`); g.addColorStop(1, 'rgba(255,240,210,0)');
    sx.strokeStyle = g; sx.lineWidth = 1.6; sx.beginPath(); sx.moveTo(s.x, s.y); sx.lineTo(tx, ty); sx.stroke();
  }
}

function drawFx(dt) {
  const p = PRESET[scene], target = reduce ? Math.min(10, p.leaves) : p.leaves;
  wind += (p.wind - wind) * Math.min(1, dt * .8);
  fxx.clearRect(0, 0, W, H);
  if (leaves.length < target && Math.random() < dt * 14) leaves.push(newLeaf(false));
  for (let i = leaves.length - 1; i >= 0; i--) {
    const l = leaves[i];
    l.sw += dt * 1.3; l.fl += l.vf * dt * (1 + wind * .3); l.rot += l.vr * dt * (1 + wind * .4);
    l.x += (wind * 70 + Math.sin(l.sw) * 28) * dt; l.y += l.vy * dt * (1 + wind * .2);
    if (l.y > H + 40 || l.x > W + 60) {
      if (leaves.length > target) { leaves.splice(i, 1); continue; }
      Object.assign(l, newLeaf(false));
    }
    drawLeaf(l);
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const l = pops[i];
    l.vy = Math.min(l.vy + 420 * dt, 70); l.vx += (wind * 60 - l.vx) * dt * .9;
    l.x += l.vx * dt; l.y += l.vy * dt; l.rot += l.vr * dt; l.vr *= 1 - dt * .5; l.fl += l.vf * dt;
    if (l.vy > 0) l.life -= dt * .22;
    if (l.life <= 0 || l.y > H + 40) { pops.splice(i, 1); continue; }
    drawLeaf(l, Math.min(1, l.life * 2));
  }
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i]; h.x += h.vx * dt; h.y += h.vy * dt; h.vx *= 1 - dt * .6; h.vy -= 14 * dt; h.life -= dt * .4;
    if (h.life <= 0) { hearts.splice(i, 1); continue; }
    fxx.save(); fxx.globalAlpha = Math.min(1, h.life * 1.6); fxx.translate(h.x, h.y); fxx.scale(h.s, h.s);
    fxx.fillStyle = h.col; fxx.fill(heartPath); fxx.restore();
  }
  drawWish(dt);
}

}

/* ---------- Letra (.lrc) ---------- */
let lines = [];
function parseLRC(txt) {
  const out = []; let offset = 0;
  txt.split(/\r?\n/).forEach(raw => {
    const off = raw.match(/^\[offset:\s*([+-]?\d+)\]/i);
    if (off) { offset = +off[1] / 1000; return; }
    const stamps = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    if (!stamps.length) return;
    let text = raw.replace(/\[[^\]]*\]/g, '').trim();
    if (text.startsWith('>') || /instagram|@\w/i.test(text)) text = '';
    stamps.forEach(m => out.push({ t: +m[1] * 60 + +m[2] - offset, text }));
  });
  return out.sort((a, b) => a.t - b.t);
}

// La escena se elige por la palabra clave de cada verso (sirve en inglés o español)
function sceneFor(text, prev) {
  const s = text.toLowerCase();
  if (/world|mundo/.test(s)) return 'world';
  if (/star|estrell/.test(s)) return 'stars';
  if (/octob|octubre/.test(s)) return 'october';
  if (/fall|otoño|autumn/.test(s)) return 'fall';
  if (/pretty|view|bonita|linda|hermosa|vista/.test(s)) return 'view';
  if (/girl|chica|niña/.test(s)) return 'girl';
  if (s.split(/\s+/).filter(Boolean).length <= 2) return 'dusk';
  return prev;
}

// Karaoke: cada palabra entra con desenfoque y se ilumina al cantarse
const lineEls = [...document.querySelectorAll('.lyrics .line')];
let li = 0, words = [], wStart = 0, wDur = 1;
function showLine(text, start, next) {
  const old = lineEls[li]; old.classList.remove('in'); old.classList.add('out');
  li ^= 1;
  const el = lineEls[li]; el.classList.remove('in', 'out'); el.textContent = ''; words = [];
  if (!text) return;
  text.split(/\s+/).forEach((w, i) => {
    const s = document.createElement('span'); s.className = 'word'; s.style.setProperty('--i', i); s.textContent = w;
    el.append(s, ' '); words.push(s);
  });
  wStart = start;
  wDur = Math.min(Math.max((next ?? start + 4) - start - .4, .8), words.length * .5 + .6);
  void el.offsetWidth; el.classList.add('in');
}
function karaoke(t) {
  const n = words.length, seg = wDur / n;
  words.forEach((w, i) => {
    const p = Math.max(0, Math.min(1, (t - wStart - seg * i) / seg));
    if (w._p !== p) { w._p = p; w.style.setProperty('--p', (p * 120).toFixed(1)); }
  });
}

let scene = 'gate';
const sceneTimers = [];
const later = (fn, ms) => sceneTimers.push(setTimeout(fn, ms));

// Octubre: se arrancan los meses anteriores, uno por uno, cada vez más rápido
function tearCalendar() {
  cal.classList.remove('revealed', 'ripped');
  calPages.forEach(p => p.classList.remove('torn'));
  void cal.offsetWidth;
  if (reduce || !calPages.length) {
    calPages.forEach(p => p.classList.add('torn'));
    cal.classList.add('revealed');
    return;
  }
  const gaps = [520, 420, 340, 290, 260, 240, 230, 220, 210];
  let t = 1150;
  calPages.forEach((p, i) => {
    later(() => { p.classList.add('torn'); cal.classList.add('ripped'); }, t);
    t += gaps[i] || 220;
  });
  later(() => cal.classList.add('revealed'), t - 120);
}

// Otoño: ella salta al montón de hojas y vuelve a salir
function bump(el) { el.classList.remove('boom'); void el.offsetWidth; el.classList.add('boom'); }
function leapIntoPile() {
  if (reduce) return;
  const g = $('#girlFig'), p = $('#pile');
  g.classList.remove('leap'); void g.offsetWidth;
  later(() => {
    g.classList.add('leap');
    later(() => { popLeaves(46, 1); bump(p); }, 1280);
    later(() => { popLeaves(18, .6); bump(p); }, 3170);
  }, 600);
}

function setScene(s) {
  if (s === scene) return;
  sceneTimers.splice(0).forEach(clearTimeout);
  wishStar = null;
  scene = s; body.dataset.scene = s;
  document.querySelectorAll('.sc').forEach(el => {
    const on = el.dataset.s === s;
    if (!on && el.classList.contains('on')) { el.classList.add('leaving'); setTimeout(() => el.classList.remove('leaving'), 1900); }
    if (on) el.classList.remove('leaving');
    el.classList.toggle('on', on);
  });
  if (s === 'fall') {
    if (!reduce) { const w = $('#swoop'); w.classList.remove('go'); void w.offsetWidth; w.classList.add('go'); }
    leapIntoPile();
  }
  if (s === 'october') tearCalendar();
  if (s === 'stars') { setMask(1); wishEl.classList.remove('done'); later(launchWish, 1700); }
  if (s === 'girl') later(() => burstHearts($('.arch'), 22), 900);
}

let cur = -2, fallbackStep = -1;
function onLine(i) {
  if (i < 0) { showLine(''); setScene('intro'); return; }
  const L = lines[i];
  showLine(L.text, L.t, lines[i + 1]?.t);
  if (!L.text) return;
  setScene(sceneFor(L.text, scene));
}

// Si no hay letra cargada, las escenas avanzan solas
const FALLBACK = ['view', 'october', 'fall', 'stars', 'girl', 'world'];
function fallbackScenes(t) {
  if (t < 17) return setScene('intro');
  const k = Math.floor((t - 17) / 7) % FALLBACK.length;
  if (k !== fallbackStep) { fallbackStep = k; setScene(FALLBACK[k]); }
}

/* ---------- Bucle principal ---------- */
let started = false, last = performance.now();
function tick(ms) {
  const dt = Math.min(.05, (ms - last) / 1000); last = ms; clock += dt;
  if (started && scene !== 'finale') {
    const t = audio.currentTime + CONFIG.desfase;
    if (lines.length) {
      let i = -1; for (let k = 0; k < lines.length && t >= lines[k].t; k++) i = k;
      if (i !== cur) { cur = i; onLine(i); }
      karaoke(t);
    } else fallbackScenes(t);
    if (audio.duration) $('#prog').style.width = (audio.currentTime / audio.duration * 100) + '%';
  }
  drawSky(dt); drawFx(dt);
  if (scene === 'girl') orbitGirl(dt);
  if (scene === 'world') orbitWorld(dt);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- Carga de archivos ---------- */
const pick = $('#pick');
function needFiles(msg, song, lrc) {
  pick.hidden = false; $('#pickMsg').textContent = msg;
  $('#pickSong').hidden = !song; $('#pickLrc').hidden = !lrc;
}
audio.src = CONFIG.cancion;
audio.addEventListener('error', () => needFiles(`No encuentro "${CONFIG.cancion}" junto a esta página. Elige el archivo de la canción:`, true, !lines.length));
fetch(CONFIG.letra).then(r => { if (!r.ok) throw 0; return r.text(); })
  .then(t => { lines = parseLRC(t); })
  .catch(() => needFiles(`No pude leer "${CONFIG.letra}". Si abriste la página directo desde la carpeta, elige el .lrc aquí (subida a tu hosting carga sola):`, !!audio.error, true));
$('#songFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) { audio.src = URL.createObjectURL(f); $('#pickSong').hidden = true; } });
$('#lrcFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const parsed = parseLRC(await f.text());
  if (!parsed.length) { $('#pickMsg').textContent = `"${f.name}" no parece un archivo .lrc con tiempos. Elige el correcto:`; e.target.value = ''; return; }
  lines = parsed; cur = -2; $('#pickLrc').hidden = true;
  if ($('#pickSong').hidden) pick.hidden = true;
});

/* ---------- Controles ---------- */
const ICON_PAUSE = '<svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 16 16"><path d="M4 2 L14 8 L4 14 Z"/></svg>';
const pp = $('#pp'); pp.innerHTML = ICON_PAUSE;
function syncPP() { pp.innerHTML = audio.paused ? ICON_PLAY : ICON_PAUSE; pp.setAttribute('aria-label', audio.paused ? 'Reproducir' : 'Pausar'); }
audio.addEventListener('play', syncPP); audio.addEventListener('pause', syncPP);
const toggle = () => audio.paused ? audio.play() : audio.pause();
pp.addEventListener('click', toggle);
addEventListener('keydown', e => { if (e.code === 'Space' && started) { e.preventDefault(); toggle(); } });

$('#startBtn').addEventListener('click', () => {
  if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().catch(() => {});
  fadeIn();
  audio.play().then(() => {
    $('#startBtn').classList.add('fly');
    started = true; body.classList.add('started'); setScene('intro');
  }).catch(() => needFiles('No se pudo reproducir la canción. Elige el archivo de audio:', true, !lines.length));
});
function fadeIn() {
  audio.volume = 0; const t0 = performance.now();
  (function step(n) { const k = Math.min(1, (n - t0) / 2500); audio.volume = k * k; if (k < 1) requestAnimationFrame(step); })(t0);
}
audio.addEventListener('ended', () => { setScene('finale'); showLine(''); });
document.addEventListener('click', e => {
  if (e.target.id !== 'again') return;
  cur = -2; fallbackStep = -1; audio.currentTime = 0; setScene('intro'); fadeIn(); audio.play();
});

/* ---------- Parallax con el mouse o el dedo ---------- */
let tx = 0, ty = 0, px = 0, py = 0;
const clamp1 = v => Math.max(-1, Math.min(1, v));
addEventListener('pointermove', e => { tx = e.clientX / W * 2 - 1; ty = e.clientY / H * 2 - 1; });
addEventListener('deviceorientation', e => {
  if (e.gamma == null) return;
  tx = clamp1(e.gamma / 25); ty = clamp1((e.beta - 45) / 25);
});
(function ease() {
  px += (tx - px) * .06; py += (ty - py) * .06;
  const r = document.documentElement.style;
  r.setProperty('--px', px.toFixed(3)); r.setProperty('--py', py.toFixed(3));
  requestAnimationFrame(ease);
})();
</script>
</body>
